name: CI

on:
  push:
    branches: [main]
    paths: ["scripts/**", "tests/**", "pyproject.toml", ".github/workflows/ci.yml"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow requests markdown pytest ruff==0.15.20
      - name: Lint
        run: ruff check scripts tests
      - name: Test
        run: pytest -v
