name: Update WakaTime stats

on:
  schedule:
    - cron: "30 0 * * *"   # daily, offset from update.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
    steps:
      - name: Check for API key
        id: key
        run: |
          if [ -n "$WAKATIME_API_KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::WAKATIME_API_KEY secret not set, skipping"; fi
      - uses: athul/waka-readme@master
        if: steps.key.outputs.ok == 'true'
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHOW_TITLE: true
          SHOW_TIME: true
          LANG_COUNT: 6
          COMMIT_MESSAGE: "chore: update WakaTime stats"
