name: Profile issue bot

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# one move at a time so guestbook.json / xo.json never race
concurrency:
  group: issue-bot
  cancel-in-progress: false

jobs:
  handle:
    # startsWith is case-insensitive
    if: startsWith(github.event.issue.title, 'guestbook') || startsWith(github.event.issue.title, 'xo')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/issue_bot.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md guestbook.json xo.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update guestbook / xo"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
