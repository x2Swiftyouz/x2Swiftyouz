name: ✍️ Sign the guestbook
description: Leave a message on x2swiftz_z's profile README
title: "Guestbook"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for stopping by! Write a short message below and press **Create**.
        A bot adds it to the profile within a minute and closes this issue.
  - type: textarea
    id: message
    attributes:
      label: Message
      description: Up to 200 characters. Plain text only, links and formatting are removed.
    validations:
      required: true
